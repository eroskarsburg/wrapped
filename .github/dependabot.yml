version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Todas as atualizações (major, minor e patch) num único PR.
      npm-dependencies:
        patterns: ["*"]
    open-pull-requests-limit: 10
